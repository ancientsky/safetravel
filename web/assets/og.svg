<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="22%" cy="50%" r="60%">
      <stop offset="0" stop-color="#19ff8a" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#0b3a22" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#050a07" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#16382a"/>
      <stop offset="1" stop-color="#050a07"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#19ff8a" stop-opacity="0"/>
      <stop offset="1" stop-color="#19ff8a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9fff3"/>
      <stop offset="1" stop-color="#19ff8a"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="300" cy="315" r="200"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#19ff8a" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#050a07"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- radar rings -->
  <g fill="none" stroke="#19ff8a" stroke-opacity="0.18" stroke-width="1.5">
    <circle cx="300" cy="315" r="250"/>
    <circle cx="300" cy="315" r="290" stroke-opacity="0.09"/>
    <circle cx="300" cy="315" r="330" stroke-opacity="0.05"/>
  </g>

  <!-- globe with radar sweep -->
  <circle cx="300" cy="315" r="200" fill="url(#ball)" stroke="#19ff8a" stroke-width="3"/>
  <g clip-path="url(#globe)" fill="none" stroke="#19ff8a" stroke-opacity="0.35" stroke-width="1.6">
    <ellipse cx="300" cy="315" rx="90" ry="200"/>
    <ellipse cx="300" cy="315" rx="160" ry="200" stroke-opacity="0.2"/>
    <path d="M100 315H500M120 235H480M120 395H480M140 180H460M140 450H460"/>
  </g>
  <g clip-path="url(#globe)">
    <path d="M300 315 L300 115 A200 200 0 0 1 473 215 Z" fill="url(#sweep)"/>
    <line x1="300" y1="315" x2="300" y2="115" stroke="#19ff8a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="300" cy="315" r="6" fill="#19ff8a"/>
  <!-- blips: sample flight hubs -->
  <g fill="#19ff8a">
    <circle cx="372" cy="232" r="6"/>
    <circle cx="238" cy="390" r="5"/>
    <circle cx="420" cy="368" r="4"/>
  </g>
  <g fill="none" stroke="#19ff8a" stroke-opacity="0.5" stroke-width="2">
    <path d="M300 315 Q 360 240 372 232" stroke-dasharray="6 6"/>
    <path d="M300 315 Q 260 360 238 390" stroke-dasharray="6 6"/>
  </g>

  <!-- text -->
  <g font-family="'Noto Sans TC', 'Noto Sans CJK TC', 'WenQuanYi Zen Hei', 'PingFang TC', sans-serif">
    <text x="560" y="250" font-size="26" fill="#19ff8a" letter-spacing="6">TAIWAN CDC · TRAVEL HEALTH</text>
    <text x="560" y="332" font-size="60" font-weight="700" fill="url(#title)">全球旅遊疫情情報板</text>
    <text x="560" y="400" font-size="44" font-weight="600" fill="#e9fff3" font-family="'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">SafeTravel TW</text>
    <text x="560" y="455" font-size="24" fill="#8fb5a0">疾管署旅遊建議等級 · 疫情摘要 · 桃園機場每日航線</text>
  </g>
  <rect x="560" y="500" width="560" height="2" fill="#19ff8a" fill-opacity="0.35"/>
  <text x="560" y="545" font-size="20" fill="#5f8a72" font-family="'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" letter-spacing="2">ancientsky.github.io/safetravel</text>
</svg>
