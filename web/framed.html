    </div>
    <div lang="en">
      <h1>This page was loaded inside another website</h1>
      <p>So that you can be sure you are seeing the original content, this site does not display inside other sites’ frames. Please open it directly.</p>
      <p><a class="btn" href="./" target="_blank" rel="noopener">Open SafeTravel TW</a></p>

</body>
