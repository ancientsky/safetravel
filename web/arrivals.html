<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>入境航班看板 · SafeTravel TW</title>
  <meta name="description" content="桃園等臺灣機場國際入境客機看板：出發地的疾管署旅遊疫情建議等級、登機門、檢疫站與行李轉盤。Inbound flights board for Taiwan airport quarantine stations.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#050a07">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- theme / language before first paint: external file, so the CSP needs no hash -->
  <script src="js/board-boot.js"></script>
  <script src="js/textsize-boot.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/d3.min.js" defer></script>
  <script type="module" src="js/board.js"></script>
  <script type="module" src="js/osk.js"></script>
</head>
<body class="board-page">
  <header class="board-head">
    <a class="brand board-brand" href="./" data-i18n-attr="title:board_back_title">
        <svg class="brand-logo" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="17" class="bl-ring"/>
          <circle cx="20" cy="20" r="10.5" class="bl-ring bl-ring-2"/>
          <path d="M20 20 L33 11" class="bl-sweep"/>
          <circle cx="20" cy="20" r="2.6" class="bl-core"/>
          <circle cx="28" cy="25" r="1.6" class="bl-blip"/>
        </svg>
      <span class="brand-text">
        <span class="brand-kicker mono" data-i18n="board_kicker">TW-CDC // INBOUND BOARD</span>
        <span class="board-h1" data-i18n="board_title">入境航班看板</span>
      </span>
    </a>
    <div class="hud-right">
      <div id="clock" class="clock" role="timer" aria-live="off">
        <span class="clock-label mono" data-i18n="clock_label">台北時間</span>
        <span class="clock-time mono">--:--:--</span>
        <span class="clock-date"></span>
      </div>
      <div class="toggles">
          <button type="button" class="btn-icon lang-toggle" data-testid="lang-toggle" data-i18n-attr="title:lang_toggle_label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
            <span data-i18n="lang_toggle">EN</span><span class="sr-only" data-i18n="lang_toggle_sr"> — 切換語言為英文</span>
          </button>
          <a class="btn-icon map-link" href="./" data-testid="map-link" data-i18n-attr="title:board_back_title;aria-label:board_back_title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5 9 4.5l6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg>
            <span data-i18n="board_back">情報板</span>
          </a>
          <a class="btn-icon trip-link" href="trip.html" data-testid="trip-link" data-i18n-attr="title:trip_link_title;aria-label:trip_link_title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7.5" width="14" height="11.5" rx="2"/><path d="M9 7.5V5.5h6v2M9 12h6M9 15h4"/></svg>
            <span data-i18n="trip_link">出國查詢</span>
          </a>
          <button type="button" class="btn-icon ts-toggle" data-testid="textsize-toggle">
            <span class="ts-a" aria-hidden="true">A<small>A</small></span><span class="ts-val">標準</span>
          </button>
          <button type="button" class="btn-icon theme-toggle" data-testid="theme-toggle">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
      </div>
    </div>
  </header>

  <aside id="arrivals" class="arrivals glass" data-testid="arrivals" role="region" aria-labelledby="arr-title">
    <div class="arr-head" data-i18n-attr="title:arr_drag_hint">
      <div class="arr-heading">
        <span class="arr-kicker mono"><i class="rec" aria-hidden="true"></i><span data-i18n="arr_kicker">INBOUND</span><span class="arr-status" role="status"></span></span>
        <h2 id="arr-title" data-i18n="arr_title">入境航班</h2>
      </div>
      <div class="arr-actions">
        <button type="button" class="btn-icon arr-scroll" aria-pressed="true" data-testid="arrivals-autoscroll" data-i18n-attr="title:arr_autoscroll_title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14M7 13l5 5 5-5"/></svg><span data-i18n="arr_autoscroll">自動捲動</span></button>
        <a class="btn-icon arr-slides" href="slide.html" data-testid="arrivals-slides-link" data-i18n-attr="title:slides_link_title;aria-label:slides_link_title"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="12" rx="1.5"/><path d="M12 15.5v4M8.5 20.5h7M7.5 8h9M7.5 11h5.5"/></svg><span data-i18n="arr_slides">衛教</span></a>
        <button type="button" class="btn-icon arr-big" aria-pressed="false" data-i18n-attr="title:arr_big_title"><span data-i18n="arr_big">大字</span></button>
      </div>
    </div>
    <div class="arr-controls">
      <label class="arr-field"><span class="sr-only" data-i18n="arr_airport">機場</span><select class="arr-airport" data-testid="arrivals-airport"></select></label>
      <div class="arr-cpf"><button type="button" class="arr-cp-btn" data-testid="arrivals-cp" aria-haspopup="true" aria-expanded="false"></button><div class="arr-cp-pop" role="group" data-i18n-attr="aria-label:arr_checkpoint" hidden></div></div>
      <label class="arr-field"><span class="sr-only" data-i18n="arr_win_label">查詢時段</span><select class="arr-win" data-testid="arrivals-window"></select></label>
      <label class="arr-field arr-find"><span class="sr-only" data-i18n="arr_find_label">搜尋航班</span><input type="search" class="arr-q" data-testid="arrivals-search" autocomplete="off" spellcheck="false" enterkeyhint="search" data-i18n-attr="placeholder:arr_find_placeholder;title:arr_find_title"></label>
    </div>
    <div class="arr-body" tabindex="-1"></div>
  </aside>
</body>
</html>
