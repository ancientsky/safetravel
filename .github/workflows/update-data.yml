name: Update data

# Refreshes data/ and web/data/ twice a day (11:17 and 21:17 Asia/Taipei), commits the result to main and
# redeploys GitHub Pages (commits made with GITHUB_TOKEN do not trigger other workflows, hence the deploy job here).
#
# Repository configuration:
#   vars.AI_PROVIDER            'gemini' to translate with the Gemini API inside this workflow. Anything else (default)
#                               skips AI here; a scheduled Claude routine translates pending items (docs/TRANSLATION_GUIDE.md).
#   secrets.GEMINI_API_KEY      required only when AI_PROVIDER=gemini
#   vars.GEMINI_MODEL           optional; defaults to gemini-3.5-flash
#   secrets.TDX_CLIENT_ID       optional; TDX (tdx.transportdata.tw) OAuth2 client credentials for the TPE flight feed.
#   secrets.TDX_CLIENT_SECRET   Without them the pipeline calls TDX anonymously (small daily quota per IP).
on:
  schedule:
    - cron: '17 3,13 * * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'Maximum Gemini API calls for this run'
        required: false
        default: '400'
      skip_gemini:
        description: 'Skip Gemini enrichment'
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    concurrency:
      group: update-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock

      - name: Install dependencies
        run: pip install --require-hashes -r pipeline/requirements.lock

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          INPUT_MAX_CALLS: ${{ inputs.max_calls }}
          INPUT_SKIP_GEMINI: ${{ inputs.skip_gemini }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'claude-routine' }}
        run: |
          args=(--max-calls "${INPUT_MAX_CALLS:-400}")
          if [ "${INPUT_SKIP_GEMINI}" = "true" ] || [ "${AI_PROVIDER}" != "gemini" ]; then args+=(--skip-gemini); fi
          python -m pipeline run "${args[@]}"

      - name: Validate exported data
        run: python -m pipeline validate

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # checkout ran with persist-credentials: false, so the token is only present in this step
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data web/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: refresh $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') Asia/Taipei"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing onto origin/main"
            sleep $((attempt * 5))
            git pull --rebase -X theirs origin main
            # data/safetravel.db is binary and has several writers: never push an export that was not re-validated
            python -m pipeline export
            python -m pipeline validate
            git add data web/data
            if ! git diff --cached --quiet; then
              git commit -m "data: re-export after rebase"
            fi
          done
          echo "could not push after 3 attempts" >&2
          exit 1

  deploy:
    needs: update
    if: ${{ needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
