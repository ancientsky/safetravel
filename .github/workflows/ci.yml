name: CI

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'data/manual/**'
      - '.github/workflows/ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt -r pipeline/requirements-dev.txt
      - name: Unit tests
        run: python -m pytest pipeline/tests -q
      - name: Offline pipeline run
        run: |
          python -m pipeline run --offline --skip-gemini
          python -m pipeline validate
