name: CI

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'data/manual/**'
      - '.github/workflows/ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.lock
            pipeline/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes -r pipeline/requirements.lock
          pip install -r pipeline/requirements-dev.txt
      - name: Unit tests
        run: python -m pytest pipeline/tests -q
      - name: Offline pipeline run
        run: |
          python -m pipeline run --offline --skip-gemini
          python -m pipeline validate
