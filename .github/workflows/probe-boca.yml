name: Probe BOCA travel warnings (temporary)
# One-off research probe: data.gov.tw dataset 116026 (國外旅遊警示分級表) metadata + XML, and the BOCA web page.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: RSS structure
        run: |
          curl -sS -m 60 -A 'Mozilla/5.0 SafeTravelTW-probe' -o rss.xml "https://www.boca.gov.tw/sp-trwa-rss-1.xml"
          python3 - <<'PY'
          import collections, re, html
          import xml.etree.ElementTree as ET
          ch = ET.parse('rss.xml').getroot().find('channel')
          items = ch.findall('item')
          print('items', len(items), 'item fields', collections.Counter(c.tag for it in items for c in it))
          lv = collections.Counter(); parts = collections.Counter(); multi = collections.defaultdict(list)
          for it in items:
              t = (it.findtext('title') or '').strip()
              p = [x.strip() for x in t.split(' - ')]
              parts[len(p)] += 1
              lv[p[0]] += 1
              multi[p[1] if len(p) > 1 else t].append(t)
          print('levels', lv.most_common())
          print('title parts', parts)
          sub = {k: v for k, v in multi.items() if len(v) > 1}
          print('countries with >1 item', len(sub))
          for k, v in list(sub.items())[:12]: print('  MULTI', v)
          for it in items[:3] + items[100:103] + items[-3:]:
              d = re.sub(r'<[^>]+>', ' ', html.unescape(it.findtext('description') or ''))
              print('ITEM', repr(it.findtext('title')), it.findtext('pubDate'), it.findtext('link'), 'desc_len', len(d), '|', re.sub(r'\s+', ' ', d)[:160])
          odd = [it.findtext('title') for it in items if len((it.findtext('title') or '').split(' - ')) != 3][:15]
          print('odd titles', odd)
          dates = sorted(filter(None, (it.findtext('pubDate') for it in items)))
          print('pubDate present', len(dates), 'sample', dates[:2], dates[-2:])
          PY
      - name: Dataset metadata (data.gov.tw API)
        run: |
          set +e
          curl -sS -m 40 -A 'Mozilla/5.0 SafeTravelTW-probe' -o meta.json -w "meta %{http_code} %{content_type} %{size_download}\n" "https://data.gov.tw/api/v2/rest/dataset/116026"
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('meta.json'))
          except Exception as e:
              print('meta not json:', e, open('meta.json', errors='replace').read()[:400]); raise SystemExit
          r = d.get('result', d)
          for k in ('title', 'identifier', 'description', 'updateFrequency', 'modifiedDate', 'publisher', 'fieldDescription'):
              print(k, '=>', str(r.get(k))[:600])
          for x in r.get('distribution', []):
              print('RESOURCE', x.get('resourceFormat'), x.get('resourceDownloadUrl'), x.get('resourceDescription'), x.get('resourceModifiedDate'))
              open('urls.txt', 'a').write(str(x.get('resourceDownloadUrl')) + '\n')
          PY
      - name: Download and summarise the XML
        run: |
          set +e
          n=0
          while read -r u; do
            [ -z "$u" ] && continue; n=$((n+1))
            curl -sSL -m 60 -A 'Mozilla/5.0 SafeTravelTW-probe' -o "res$n.bin" -w "res$n %{http_code} %{content_type} %{size_download} %{url_effective}\n" "$u"
            head -c 1500 "res$n.bin"; echo; echo ----
          done < urls.txt
          python3 - <<'PY'
          import glob, collections
          import xml.etree.ElementTree as ET
          for f in sorted(glob.glob('res*.bin')):
              try:
                  root = ET.parse(f).getroot()
              except Exception as e:
                  print(f, 'not xml', e); continue
              items = list(root)
              print(f, 'root', root.tag, 'children', len(items))
              tags = collections.Counter(c.tag for it in items for c in it)
              print('fields', dict(tags))
              def rec(it): return {c.tag: (c.text or '').strip()[:120] for c in it}
              for it in items[:6]: print('REC', rec(it))
              for key in ('severity_level', 'alert_level', 'level', 'Severity', 'severity'):
                  vals = collections.Counter(rec(it).get(key) for it in items)
                  if len(vals) > 1: print('COUNT', key, vals.most_common(10))
              # anything that looks like a level/colour field
              for t in tags:
                  vals = collections.Counter(rec(it).get(t) for it in items)
                  if 1 < len(vals) <= 12: print('ENUM', t, vals.most_common(12))
          PY
      - name: BOCA web page
        run: |
          set +e
          curl -sSL -m 40 -A 'Mozilla/5.0 SafeTravelTW-probe' -o page.html -w "page %{http_code} %{content_type} %{size_download}\n" "https://www.boca.gov.tw/sp-trwa-list-1.html"
          python3 - <<'PY'
          import re, html
          s = open('page.html', encoding='utf-8', errors='replace').read()
          print('title', re.search(r'<title>(.*?)</title>', s, re.S).group(1).strip() if '<title>' in s else '-')
          txt = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', s, flags=re.S)
          txt = html.unescape(re.sub(r'<[^>]+>', ' ', txt))
          txt = re.sub(r'\s+', ' ', txt)
          i = txt.find('警示')
          print(txt[max(0, i - 200): i + 2500])
          print('links', sorted(set(re.findall(r'href="([^"]*(?:xml|csv|json|trwa)[^"]*)"', s)))[:30])
          PY
