name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - name: Install dependencies
        run: pip install --require-hashes -r pipeline/requirements.lock
      - name: Validate web/data before publishing
        run: python -m pipeline validate
      - name: Check the vendored d3 subset covers every d3 call
        run: node scripts/check-d3.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
        with:
          enablement: true
      - name: Carry over the live arrivals.json (no TDX call)
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          curl -fsS "${BASE_URL}/data/arrivals.json?t=$(date +%s)" -o web/data/arrivals.json && python3 -m json.tool web/data/arrivals.json >/dev/null || rm -f web/data/arrivals.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
