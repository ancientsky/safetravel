name: probe-flights
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ODP sources
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          D=data/raw/flights/probe2; rm -rf $D; mkdir -p $D
          f() { name=$1; url=$2; code=$(curl -sS -L -A "$UA" -m 90 -o "$D/$name" -w '%{http_code} %{content_type} %{size_download}' "$url"); echo "$name <- $url :: $code" | tee -a $D/NOTES.txt; }
          f rt_v2.csv 'https://odp.taoyuan-airport.com/dataset/2025102001?format=csv'
          f rt_v2.json 'https://odp.taoyuan-airport.com/dataset/2025102001?format=json'
          f rt_v1.csv 'https://odp.taoyuan-airport.com/dataset/2023081816?format=csv'
          f sched.csv 'https://odp.taoyuan-airport.com/dataset/2022110903?format=csv'
          f sched.json 'https://odp.taoyuan-airport.com/dataset/2022110903?format=json'
          f odp_home.html 'https://odp.taoyuan-airport.com/'
          f odp_ds_page.html 'https://odp.taoyuan-airport.com/dataset/2025102001'
          for x in rt_v2.csv rt_v1.csv sched.csv rt_v2.json; do echo "=== $x ===" | tee -a $D/NOTES.txt; head -c 1500 $D/$x | tee -a $D/NOTES.txt; echo; wc -l $D/$x | tee -a $D/NOTES.txt; done
          ls -la $D | tee -a $D/NOTES.txt
      - name: Commit probe output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/raw/flights/probe2
          git commit -m 'probe: Taoyuan ODP raw responses' || echo nothing
          git push
