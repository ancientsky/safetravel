name: probe-flights
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TDX sources
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          D=data/raw/flights/probe3; rm -rf $D; mkdir -p $D
          f() { name=$1; url=$2; code=$(curl -sS -L -A "$UA" -m 40 -o "$D/$name" -w '%{http_code} %{content_type} %{size_download}' "$url"); echo "$name <- $url :: $code" | tee -a $D/NOTES.txt; }
          f tdx_fids_tpe.json 'https://tdx.transportdata.tw/api/basic/v2/Air/FIDS/Airport/TPE?%24top=5&%24format=JSON'
          f tdx_fids_dep.json 'https://tdx.transportdata.tw/api/basic/v2/Air/FIDS/Airport/Departure/TPE?%24top=3&%24format=JSON'
          f tdx_fids_arr.json 'https://tdx.transportdata.tw/api/basic/v2/Air/FIDS/Airport/Arrival/TPE?%24top=3&%24format=JSON'
          f tdx_schedule_tpe.json 'https://tdx.transportdata.tw/api/basic/v2/Air/GeneralSchedule/International?%24top=3&%24format=JSON'
          f tdx_airport.json 'https://tdx.transportdata.tw/api/basic/v2/Air/Airport?%24top=3&%24format=JSON'
          f tdx_token_probe.txt 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token'
          f odp_quick.html 'https://odp.taoyuan-airport.com/'
          for x in tdx_fids_tpe.json tdx_fids_dep.json tdx_fids_arr.json tdx_schedule_tpe.json tdx_airport.json tdx_token_probe.txt; do echo "=== $x ===" | tee -a $D/NOTES.txt; head -c 2500 $D/$x | tee -a $D/NOTES.txt; echo; done
          ls -la $D | tee -a $D/NOTES.txt
      - name: Commit probe output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/raw/flights/probe3
          git commit -m 'probe: TDX raw responses' || echo nothing
          git pull --rebase origin main || true
          git push || (git pull --rebase origin main && git push)
