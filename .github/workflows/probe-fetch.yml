name: Probe fetch BOCA + MAC raw files (temporary)
# One-off: saves the BOCA travel-warning RSS and the MAC travel-warning page under data/raw/ so the parser can be
# developed offline (the dev sandbox cannot reach these sites). Delete after use.
on:
  workflow_dispatch:
permissions: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download
        run: |
          set +e
          mkdir -p data/raw/boca
          UA='Mozilla/5.0 (compatible; SafeTravelTW/1.0; +https://ancientsky.github.io/safetravel/)'
          curl -sSL -m 60 -A "$UA" -o data/raw/boca/sp-trwa-rss-1.xml -w "boca %{http_code} %{size_download}\n" "https://www.boca.gov.tw/sp-trwa-rss-1.xml"
          curl -sSL -m 60 -A "$UA" -o data/raw/boca/sp-trwa-list-1.html -w "boca list %{http_code} %{size_download}\n" "https://www.boca.gov.tw/sp-trwa-list-1.html"
          ls -la data/raw/boca
      - name: Commit raw files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data/raw/boca
          git commit -m "data: raw BOCA travel-warning list page (fixture)" || exit 0
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done
          exit 1
