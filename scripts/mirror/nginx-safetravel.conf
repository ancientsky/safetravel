# SafeTravel TW intranet mirror — nginx site (docs/MIRROR.md).
# Install as /etc/nginx/conf.d/safetravel.conf (included in the http{} block), edit the lines marked ←, then:
#   nginx -t && systemctl reload nginx
#
# Files: /srv/safetravel/www/safetravel -> ../releases/<release>, switched atomically by safetravel-sync.sh.
# The site uses relative URLs only, so it is served at https://<host>/safetravel/ exactly like GitHub Pages.
# Do not enable open_file_cache for this site (or keep its "valid" at a few seconds): nginx must follow the
# switched symlink on every request.

# Nothing on the site has a fingerprinted file name, so text files are revalidated on every load (ETag /
# Last-Modified -> a cheap 304 when unchanged) and images are cached for an hour.
map $uri $safetravel_cache_control {
    default                                          "no-cache";
    ~*\.(?:png|jpe?g|webp|avif|gif|ico|woff2?)$      "public, max-age=3600";
}

# Content-Security-Policy header. Every page carries its full policy in a <meta> tag (with the hash of its inline
# script); both policies apply, so the header for pages adds only what a <meta> cannot say (frame-ancestors) and
# directives that never change. No script-src/default-src here: it would have to repeat the hash, and this file
# is not updated when the site is. Everything that is not a page (scripts, data, images, fonts) is never meant to
# be shown as a document: lock it down. script-src and connect-src 'self' are for workers (js/epidemics-worker.js):
# a worker gets its policy from the header of its own script, fetches epidemics.json, and may one day import
# another script of this site.
map $uri $safetravel_csp {
    default     "default-src 'none'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'";
    ~\.html$    "frame-ancestors 'self'; base-uri 'none'; form-action 'none'; object-src 'none'";
}

server {
    listen 80;
    listen [::]:80;
    server_name safetravel.example.internal;              # ← this machine's intranet host name
    # every server block needs its own (or one in nginx.conf): without it the redirect answers
    # "Server: nginx/1.x.y (Ubuntu)" and prints the same on its page, which vulnerability scans report
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;                                 # nginx >= 1.25.1 (Ubuntu 26.04): "listen 443 ssl;" + "http2 on;" — install.sh rewrites it
    listen [::]:443 ssl http2;
    server_name safetravel.example.internal;              # ←

    ssl_certificate     /etc/nginx/tls/safetravel.crt;    # ← server certificate first, then the intermediate(s) ("fullchain.pem")
    ssl_certificate_key /etc/nginx/tls/safetravel.key;    # ←
    ssl_protocols       TLSv1.2 TLSv1.3;
    # TLS 1.2: forward secrecy (ECDHE) and AEAD only, no RSA key exchange, CBC, CAMELLIA, ARIA or CCM (vulnerability
    # scans report those). TLS 1.3 suites are not set by ssl_ciphers and are all strong. The ECDSA entries are for an
    # ECDSA certificate; with an RSA one the ECDHE-RSA entries are used.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:safetravel_tls:10m;
    ssl_session_timeout 1d;

    root /srv/safetravel/www;
    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/safetravel.access.log;
    error_log  /var/log/nginx/safetravel.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain text/markdown;

    # Answers that do not come from /safetravel/ (the two redirects below, 404s outside the site, the status file):
    # the same security headers, a strict CSP and no-store (a redirect costs nothing to fetch again, and a cached
    # 301 cannot be withdrawn). nginx drops these in any location that has add_header lines of its own.
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # with the one below

    location = / { return 302 /safetravel/; }
    location = /safetravel { return 301 /safetravel/; }

    location /safetravel/ {
        index index.html;
        try_files $uri $uri/ =404;
        # "always": also on 304 / 404 answers. nginx drops inherited add_header lines in any block that has its own,
        # so keep the whole set together.
        add_header Cache-Control $safetravel_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # no other site may show these pages inside a frame (clickjacking). X-Frame-Options for old browsers,
        # frame-ancestors for current ones. A <meta> CSP cannot carry frame-ancestors, so it has to be a header.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy $safetravel_csp always;
        # Optional, once every kiosk reaches this host over HTTPS only (remove the # here and in the server-level set
        # above). includeSubDomains covers names below this host only, never other *.cdc.gov.tw sites. No preload.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # The pages carry their own Content-Security-Policy <meta> (with a script hash); see map $safetravel_csp
        # before adding anything to the CSP header.
        # Hidden files: 404 like any missing file. A 403 here made scanners that compare the status of a normal and
        # a dot-prefixed file name report "CVE-2024-38474" (an Apache bug) against this nginx.
        location ~ /\. { return 404; }
    }

    # Mirror health for monitoring (safetravel-sync.sh writes it after every run).
    location = /safetravel/_mirror/status.json {
        alias /srv/safetravel/state/status.json;
        default_type application/json;
        # no add_header here: it gets the server-level set (no-store and the security headers)
        # allow 10.0.0.0/8;                              # ← optionally limit to the operations network
        # deny all;
    }
}
