# SafeTravel TW intranet mirror — nginx site (docs/MIRROR.md).
# Install as /etc/nginx/conf.d/safetravel.conf (included in the http{} block), edit the lines marked ←, then:
#   nginx -t && systemctl reload nginx
#
# Files: /srv/safetravel/www/safetravel -> ../releases/<release>, switched atomically by safetravel-sync.sh.
# The site uses relative URLs only, so it is served at https://<host>/safetravel/ exactly like GitHub Pages.
# Do not enable open_file_cache for this site (or keep its "valid" at a few seconds): nginx must follow the
# switched symlink on every request.

# Nothing on the site has a fingerprinted file name, so text files are revalidated on every load (ETag /
# Last-Modified -> a cheap 304 when unchanged) and images are cached for an hour.
map $uri $safetravel_cache_control {
    default                                          "no-cache";
    ~*\.(?:png|jpe?g|webp|avif|gif|ico|woff2?)$      "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name safetravel.example.internal;              # ← this machine's intranet host name
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;                                 # nginx >= 1.25.1 (Ubuntu 26.04): "listen 443 ssl;" + "http2 on;" — install.sh rewrites it
    listen [::]:443 ssl http2;
    server_name safetravel.example.internal;              # ←

    ssl_certificate     /etc/nginx/tls/safetravel.crt;    # ← server certificate first, then the intermediate(s) ("fullchain.pem")
    ssl_certificate_key /etc/nginx/tls/safetravel.key;    # ←
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:safetravel_tls:10m;
    ssl_session_timeout 1d;

    root /srv/safetravel/www;
    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/safetravel.access.log;
    error_log  /var/log/nginx/safetravel.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain text/markdown;

    location = / { return 302 /safetravel/; }
    location = /safetravel { return 301 /safetravel/; }

    location /safetravel/ {
        index index.html;
        try_files $uri $uri/ =404;
        # "always": also on 304 / 404 answers. nginx drops inherited add_header lines in any block that has its own,
        # so keep the whole set together.
        add_header Cache-Control $safetravel_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # no other site may show these pages inside a frame (clickjacking). X-Frame-Options for old browsers,
        # frame-ancestors for current ones. A <meta> CSP cannot carry frame-ancestors, so it has to be a header.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        # Optional, once every kiosk reaches this host over HTTPS only:
        # add_header Strict-Transport-Security "max-age=31536000" always;
        # The pages carry their own Content-Security-Policy <meta> (with a script hash). The header above holds
        # frame-ancestors only, which restricts nothing else; do not add fetch directives (script-src …) to it.
        location ~ /\. { deny all; }
    }

    # Mirror health for monitoring (safetravel-sync.sh writes it after every run).
    location = /safetravel/_mirror/status.json {
        alias /srv/safetravel/state/status.json;
        default_type application/json;
        add_header Cache-Control no-store;
        # allow 10.0.0.0/8;                              # ← optionally limit to the operations network
        # deny all;
    }
}
